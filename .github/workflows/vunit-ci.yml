name: VHDL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (VUnit)
        run: |
          python -m pip install --upgrade pip
          pip install vunit_hdl

      - name: Install GHDL (Simulator)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Run VUnit tests
        run: |
          python run.py
